name: Offline regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "**.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources without executing the scanner
        run: python -m compileall -q -x '/\.git/' .
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
