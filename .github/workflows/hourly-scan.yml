name: 30-minute paper scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "crypto_daytrade_state.json"
      - "scan_live.json"
      - "signal.json"
  schedule:
    # Off the top of the hour to reduce GitHub's documented peak-time delays.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run validated paper scanner
        run: python run_scanner.py

      - name: Validate outputs
        run: |
          python - <<'PY'
          import json

          for name in (
              "crypto_daytrade_state.json",
              "scan_live.json",
              "signal.json",
          ):
              with open(name, encoding="utf-8") as fh:
                  json.load(fh)

          with open("crypto_daytrade_state.json", encoding="utf-8") as fh:
              state = json.load(fh)

          assert all(
              key in state
              for key in (
                  "struct80",
                  "candidate_book",
                  "expectancy_log",
              )
          )
          assert len(state["struct80"]) == 80
          assert state.get("health", {}).get("status") == "ok"
          assert state.get("version") == "3.4.0"
          PY

      - name: Notify David of manual action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_notify.py

      - name: Save validated state
        run: |
          git config user.name "paper-scan-bot"
          git config user.email "paper-scan-bot@users.noreply.github.com"
          git add crypto_daytrade_state.json scan_live.json signal.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: paper scan"
          git push
