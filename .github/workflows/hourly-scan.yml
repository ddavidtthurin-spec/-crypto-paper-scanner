name: 30-minute paper scan

on:
  push:
    branches: [main]
    paths-ignore:
      - "crypto_daytrade_state.json"
      - "scan_live.json"
      - "signal.json"
  schedule:
    # GitHub scheduling is best-effort; retain the existing cadence.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The decision runner may make two scans, each bounded at 12 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Queued/re-run jobs must not start from an obsolete state snapshot.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run validated paper scanner
        run: python run_scanner.py

      - name: Validate outputs
        run: python validate_outputs.py

      - name: Save validated state before sending notifications
        run: |
          git config user.name "paper-scan-bot"
          git config user.email "paper-scan-bot@users.noreply.github.com"
          python save_state.py

      - name: Notify David of manual action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_notify.py

      - name: Preserve recovery outputs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-scan-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crypto_daytrade_state.json
            scan_live.json
            signal.json
          retention-days: 7
          if-no-files-found: warn
